name: Feature request
description: Suggest an improvement that fits the scope of World Clock.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        World Clock is a static, browser-native project. Features that require a server,
        accounts, tracking, or a heavy build pipeline are unlikely to be accepted. See
        [CONTRIBUTING.md](https://github.com/somphol/worldclock/blob/main/CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case, not just the implementation.
      placeholder: I want to..., but currently...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
      placeholder: Add a control that...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, similar tools, or simpler approaches.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Gameplay or interaction
        - Visual design
        - Accessibility
        - Performance
        - Persistence or import/export
        - Documentation
        - Deployment
        - Other

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This can be implemented in the existing static app.
          required: true
        - label: This does not require a backend, account, or tracking.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, references, or related issues.
